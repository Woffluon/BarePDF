[workspace]
members = [
    "crates/barepdf-core",
    "crates/barepdf-pdf",
    "crates/barepdf-render",
    "crates/barepdf-platform",
    "crates/barepdf-platform-windows",
    "crates/barepdf-i18n",
    "crates/barepdf-ui",
    "crates/barepdf-thumbnail",
    "apps/barepdf",
]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
rust-version = "1.92"
authors = ["BarePDF Contributors"]
license = "MIT"
repository = "https://github.com/Woffluon/BarePDF"

[workspace.dependencies]
lru = "0.18.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-unwind]
inherits = "release"
panic = "unwind"
