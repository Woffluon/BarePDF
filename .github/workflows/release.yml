name: Release

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit on main to release (defaults to current main)"
        required: false
        type: string

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Evaluate release gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          enabled=false
          reason="CI run is not a successful push on main; release skipped."
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            enabled=true
            reason="Manual release requested."
          elif [[ "$CI_CONCLUSION" == "success" && "$CI_BRANCH" == "main" && "$CI_EVENT" == "push" ]]; then
            enabled=true
            reason="Successful main CI run is eligible for release discovery."
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "### Release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

  preflight:
    name: Update Signing Preflight
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: windows-latest
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve target commit
        id: target
        shell: powershell
        env:
          DISPATCH_SHA: ${{ inputs.target_sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $Requested = if ($env:GITHUB_EVENT_NAME -eq "workflow_run") { $env:CI_SHA } elseif ($env:DISPATCH_SHA) { $env:DISPATCH_SHA } else { "origin/main" }
          $Target = (& git rev-parse "$Requested^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve release target '$Requested'." }
          & git merge-base --is-ancestor $Target origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release target must be reachable from main: $Target" }
          "sha=$Target" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify update signing key
        shell: powershell
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_PRIVATE_KEY_BASE64)) {
            throw "Missing required release signing configuration: UPDATE_MANIFEST_PRIVATE_KEY_BASE64"
          }
          $PrivateKeyPath = Join-Path $env:RUNNER_TEMP "barepdf-update-signing.pem"
          try {
            [IO.File]::WriteAllBytes($PrivateKeyPath, [Convert]::FromBase64String($env:UPDATE_MANIFEST_PRIVATE_KEY_BASE64))
            powershell -File packaging/windows/scripts/update-manifest-signature.ps1 -Action CheckKey -PrivateKeyPath $PrivateKeyPath
          } finally {
            Remove-Item -LiteralPath $PrivateKeyPath -Force -ErrorAction SilentlyContinue
          }

  discover:
    name: Discover Unreleased Versions
    needs: preflight
    runs-on: windows-latest
    outputs:
      releases: ${{ steps.discover.outputs.releases }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Checkout target history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0

      - name: Find version-changing commits since latest tag
        id: discover
        shell: powershell
        env:
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell -File scripts/discover-release-backlog.ps1 -TargetSha $env:TARGET_SHA

  publish:
    name: Publish ${{ matrix.release.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        release: ${{ fromJson(needs.discover.outputs.releases) }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.release.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check immutable tag and release state
        id: state
        shell: powershell
        env:
          RELEASE_SHA: ${{ matrix.release.sha }}
          RELEASE_TAG: ${{ matrix.release.tag }}
        run: |
          powershell -File scripts/test-existing-release.ps1 `
            -ReleaseSha $env:RELEASE_SHA `
            -ReleaseTag $env:RELEASE_TAG `
            -Version "${{ matrix.release.version }}"

      - name: Download CI release artifacts
        if: steps.state.outputs.needed == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ matrix.release.sha }}
        run: |
          $RunId = if ($env:EVENT_NAME -eq "workflow_run" -and $env:CI_RUN_ID) {
            $env:CI_RUN_ID
          } else {
            (& gh run list --commit $env:RELEASE_SHA --workflow CI --status success --json databaseId --jq '.[0].databaseId').Trim()
          }
          if (-not $RunId) {
            throw "No successful CI workflow run found for commit $env:RELEASE_SHA"
          }
          Write-Host "Downloading CI artifacts from run $RunId..."
          New-Item -ItemType Directory -Path target/release/artifacts -Force | Out-Null
          gh run download $RunId --name BarePDF-Windows-CI-Build --dir target/release/artifacts
          gh run download $RunId --name BarePDF-Linux-CI-Build --dir target/release/artifacts

      - name: Consolidate Multi-Platform Checksums
        if: steps.state.outputs.needed == 'true'
        shell: powershell
        run: |
          $Version = "${{ matrix.release.version }}"
          $ChecksumFile = "target/release/artifacts/BarePDF-v$Version-SHA256SUMS.txt"
          $ExistingHashes = if (Test-Path $ChecksumFile) { Get-Content $ChecksumFile } else { @() }
          $LinuxFiles = Get-ChildItem -LiteralPath target/release/artifacts -File |
            Where-Object { $_.Name -like "*.deb" -or $_.Name -like "*.AppImage" }
          $NewLines = foreach ($f in $LinuxFiles) {
            if (-not ($ExistingHashes -match [regex]::Escape($f.Name))) {
              "$((Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
            }
          }
          if ($NewLines) {
            $NewLines | Add-Content -Path $ChecksumFile
          }
          Write-Host "Consolidated SHA-256 Checksums:" -ForegroundColor Cyan
          Get-Content $ChecksumFile

      - name: Sign update manifest
        if: steps.state.outputs.needed == 'true'
        shell: powershell
        env:
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
        run: |
          $PrivateKeyPath = Join-Path $env:RUNNER_TEMP "barepdf-update-signing.pem"
          try {
            [IO.File]::WriteAllBytes($PrivateKeyPath, [Convert]::FromBase64String($env:UPDATE_MANIFEST_PRIVATE_KEY_BASE64))
            powershell -File packaging/windows/scripts/update-manifest-signature.ps1 `
              -Action Sign `
              -PrivateKeyPath $PrivateKeyPath `
              -ManifestPath target/release/artifacts/latest.json
          } finally {
            Remove-Item -LiteralPath $PrivateKeyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Validate signed release manifest
        if: steps.state.outputs.needed == 'true'
        shell: powershell
        run: |
          powershell -File packaging/windows/scripts/test-release-manifest.ps1 -RequireSignature
          "COMMIT_MSG=$(git log -1 --format='%s')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish immutable GitHub release
        if: steps.state.outputs.needed == 'true'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ matrix.release.tag }}
          name: BarePDF ${{ matrix.release.tag }}
          body: |
            ${{ env.COMMIT_MSG }}

            ### Downloads
            - **Windows installer:** `BarePDF-Setup-x64-v${{ matrix.release.version }}.exe`
            - **Portable package:** `BarePDF-Portable-x64-v${{ matrix.release.version }}.zip`
            - **Debian / Pardus package:** `barepdf_${{ matrix.release.version }}_amd64.deb`
            - **Universal Linux AppImage:** `BarePDF-${{ matrix.release.version }}-x86_64.AppImage`
            - **Checksums:** `BarePDF-v${{ matrix.release.version }}-SHA256SUMS.txt`

            Update authenticity policy: https://github.com/Woffluon/BarePDF#update-authenticity-policy
          target_commitish: ${{ matrix.release.sha }}
          files: target/release/artifacts/*
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: "false"
          token: ${{ github.token }}

  finalize:
    name: Finalize Latest Release
    needs: [ discover, publish ]
    if: needs.discover.outputs.count != '0' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Mark newest release as latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_JSON: ${{ needs.discover.outputs.releases }}
        run: |
          $Discovered = @($env:RELEASES_JSON | ConvertFrom-Json)
          if ($Discovered.Count -eq 0) { throw "Release discovery output is empty." }
          $Latest = $Discovered | Sort-Object { [version]$_.version } -Descending | Select-Object -First 1
          $PublishedJson = gh release view $Latest.tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw "Cannot read discovered release $($Latest.tag)." }
          $Published = $PublishedJson | ConvertFrom-Json
          if ($Published.tagName -cne $Latest.tag -or $Published.isDraft -or $Published.isPrerelease) {
            throw "Discovered release $($Latest.tag) is not a published stable release."
          }
          gh release edit $Latest.tag --repo $env:GITHUB_REPOSITORY --latest
          if ($LASTEXITCODE -ne 0) { throw "Cannot mark discovered release $($Latest.tag) as latest." }

      - name: Deploy refreshed website data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
