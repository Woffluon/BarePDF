name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website-checks:
    name: Website Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10

      - name: Install website dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Type-check and build website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm --dir website run test
          pnpm --dir website run check
          pnpm --dir website run build

  rust-lints:
    name: Rust Lints & Security
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cargo Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify Version Consistency
        shell: powershell
        run: |
          powershell -File scripts/test-versioning.ps1
          powershell -File packaging/windows/scripts/validate-version.ps1

      - name: Format Check
        run: cargo fmt --all --check

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Production Panic Policy
        run: cargo clippy --workspace --lib --bins --all-features --locked -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unreachable

      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit@0.22.0

      - name: RustSec Audit
        run: cargo audit --deny warnings

  rust-tests:
    name: Rust Unit & Integration Tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0

      - name: Cargo Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch verified PDFium runtime
        shell: powershell
        run: |
          powershell -File packaging/windows/scripts/fetch-pdfium.ps1 -Destination target/debug/pdfium.dll
          New-Item -ItemType Directory -Path target/debug/deps -Force | Out-Null
          Copy-Item target/debug/pdfium.dll -Destination target/debug/deps/pdfium.dll -Force

      - name: Unit & Integration Tests
        run: cargo test --workspace --all-features --locked

  windows-build-and-package:
    name: Windows Package & Installer Test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0

      - name: Cargo Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Fetch verified PDFium runtime
        shell: powershell
        run: powershell -File packaging/windows/scripts/fetch-pdfium.ps1

      - name: Stage Release Artifacts
        shell: powershell
        run: powershell -File packaging/windows/scripts/stage-release.ps1

      - name: Build Portable Package
        shell: powershell
        run: powershell -File packaging/windows/scripts/build-portable.ps1

      - name: Compile Windows Installer
        shell: powershell
        run: powershell -File packaging/windows/scripts/build-installer.ps1

      - name: Validate Installer & Registry Configuration
        shell: powershell
        run: |
          $advanced = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
          New-Item -Path $advanced -Force | Out-Null
          Set-ItemProperty -Path $advanced -Name IconsOnly -Type DWord -Value 0
          powershell -File packaging/windows/scripts/validate-installer.ps1

      - name: Generate Checksums
        shell: powershell
        run: |
          powershell -File packaging/windows/scripts/generate-checksums.ps1
          powershell -File packaging/windows/scripts/test-release-manifest.ps1
          powershell -File packaging/windows/scripts/test-release-manifest.tests.ps1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BarePDF-Windows-CI-Build
          path: target/release/artifacts/*

  linux-build-and-package:
    name: Linux Package (.deb & AppImage) Test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0

      - name: Cargo Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libgl1-mesa-dev libgbm-dev libfuse2 file jq

      - name: Install cargo-deb
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deb

      - name: Download Pinned Pdfium Linux Binary
        run: |
          mkdir -p target/release
          curl -fsSL -o target/release/pdfium-linux-x64.tgz https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7988/pdfium-linux-x64.tgz
          tar -xzf target/release/pdfium-linux-x64.tgz -C target/release lib/libpdfium.so
          mv target/release/lib/libpdfium.so target/release/
          rm -rf target/release/lib target/release/pdfium-linux-x64.tgz

      - name: Build BarePDF Release
        run: cargo build --release --locked --package barepdf

      - name: Build Debian/Pardus Package (.deb)
        run: |
          cargo deb --package barepdf --no-build
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="barepdf") | .version')
          mv target/debian/*.deb "target/debian/barepdf_${VERSION}_amd64.deb"

      - name: Generate AppImage
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="barepdf") | .version')
          curl -fsSL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/barepdf AppDir/usr/bin/
          cp target/release/libpdfium.so AppDir/usr/lib/
          cp packaging/linux/barepdf.desktop AppDir/
          cp packaging/linux/icons/barepdf.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          cp packaging/linux/icons/barepdf.svg AppDir/barepdf.svg
          echo '#!/bin/sh' > AppDir/AppRun
          echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> AppDir/AppRun
          echo 'export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"' >> AppDir/AppRun
          echo 'exec "${HERE}/usr/bin/barepdf" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "BarePDF-${VERSION}-x86_64.AppImage"

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BarePDF-Linux-CI-Build
          path: |
            target/debian/*.deb
            *.AppImage

