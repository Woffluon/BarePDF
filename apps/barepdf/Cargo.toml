[package]
name = "barepdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "BarePDF: Bare, Fast, Yours. Ultra-lightweight PDF reader executable"

[dependencies]
barepdf-core = { path = "../../crates/barepdf-core" }
barepdf-pdf = { path = "../../crates/barepdf-pdf" }
barepdf-render = { path = "../../crates/barepdf-render" }
barepdf-platform = { path = "../../crates/barepdf-platform" }
barepdf-platform-windows = { path = "../../crates/barepdf-platform-windows" }
barepdf-i18n = { path = "../../crates/barepdf-i18n" }
barepdf-ui = { path = "../../crates/barepdf-ui" }
slint = { workspace = true, features = ["raw-window-handle-06"] }
lru.workspace = true
tracing-subscriber.workspace = true
raw-window-handle.workspace = true
ed25519-dalek.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true
ureq.workspace = true
uuid = { workspace = true, features = ["v4"] }
i-slint-backend-winit = { version = "1.17.1", default-features = false }
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
barepdf-platform-linux = { path = "../../crates/barepdf-platform-linux" }

[package.metadata.deb]
name = "barepdf"
maintainer = "BarePDF Contributors <contact@barepdf.app>"
copyright = "2026, BarePDF Contributors"
license-file = ["../../LICENSE", "4"]
depends = "$auto, libxkbcommon0, libfontconfig1, libgbm1, xdg-utils"
section = "graphics"
priority = "optional"
assets = [
    ["target/release/barepdf", "usr/bin/barepdf", "755"],
    ["target/release/libpdfium.so", "usr/lib/barepdf/libpdfium.so", "644"],
    ["../../packaging/linux/barepdf.desktop", "usr/share/applications/barepdf.desktop", "644"],
    ["../../packaging/linux/icons/barepdf.svg", "usr/share/icons/hicolor/scalable/apps/barepdf.svg", "644"],
]

[lints]
workspace = true



