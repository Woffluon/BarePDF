[package]
name = "barepdf-render"
version = "1.0.0"
edition = "2021"
authors = ["BarePDF Contributors"]
description = "Demand-driven render scheduler, worker pool, and LRU bitmap cache for BarePDF"

[dependencies]
barepdf-core = { path = "../barepdf-core" }
barepdf-pdf = { path = "../barepdf-pdf" }
crossbeam-channel = "0.5"
lru = "0.13"
tracing = "0.1"
thiserror = "2.0"
