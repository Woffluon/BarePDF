[package]
name = "barepdf-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows OS implementation of file dialogs, clipboard, and printing for BarePDF"

[dependencies]
barepdf-core = { path = "../barepdf-core" }
barepdf-platform = { path = "../barepdf-platform" }
rfd = "0.15"
arboard = { version = "3.4", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
