[package]
name = "barepdf-i18n"
version = "1.0.0"
edition = "2021"
authors = ["BarePDF Contributors"]
description = "Internationalization engine and translation resources for BarePDF"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemServices", "Win32_Globalization"] }
