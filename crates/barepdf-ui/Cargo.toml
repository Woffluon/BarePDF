[package]
name = "barepdf-ui"
version = "1.0.0"
edition = "2021"
authors = ["BarePDF Contributors"]
description = "Slint desktop interface views, themes, and view-models for BarePDF"

[dependencies]
barepdf-core = { path = "../barepdf-core" }
barepdf-render = { path = "../barepdf-render" }
barepdf-platform = { path = "../barepdf-platform" }
slint = { version = "1.9", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-2"] }
tracing = "0.1"
